<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPTC Kannur — Content Management System</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      /* Base CMS UI enhancements */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS Core Script -->
    <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

    <script>
      // =========================================================================
      // WordPress-Style Live Preview Template for Custom Pages
      // =========================================================================

      // CSS that mirrors the actual site styling for the preview iframe
      var previewCSS = `
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
          --primary: #1a5276;
          --primary-light: #2980b9;
          --primary-dark: #0d2f44;
          --accent: #e67e22;
          --accent-light: #f39c12;
          --bg-primary: #0a0f1a;
          --bg-card: #111827;
          --text-primary: #f1f5f9;
          --text-secondary: #94a3b8;
          --border-color: #1e293b;
          --danger: #e74c3c;
          --success: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          line-height: 1.7;
          -webkit-font-smoothing: antialiased;
        }

        /* ---- Hero Banner ---- */
        .preview-hero {
          position: relative;
          min-height: 200px;
          display: flex;
          align-items: flex-end;
          padding: 3rem 2rem 2rem;
          background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
          background-size: cover;
          background-position: center;
          overflow: hidden;
        }
        .preview-hero::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(10,15,26,0.85));
        }
        .preview-hero--with-image {
          min-height: 260px;
        }
        .preview-hero__content {
          position: relative;
          z-index: 1;
          max-width: 900px;
        }
        .preview-hero__back {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          color: rgba(255,255,255,0.7);
          font-size: 0.85rem;
          text-decoration: none;
          margin-bottom: 0.75rem;
          font-weight: 500;
        }
        .preview-hero h1 {
          font-size: clamp(1.6rem, 3vw, 2.4rem);
          font-weight: 800;
          color: #fff;
          line-height: 1.2;
          text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ---- Status badges ---- */
        .preview-status {
          display: flex;
          gap: 8px;
          padding: 0.75rem 2rem;
          background: var(--bg-card);
          border-bottom: 1px solid var(--border-color);
          flex-wrap: wrap;
        }
        .preview-badge {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          padding: 3px 10px;
          border-radius: 20px;
          font-size: 0.72rem;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.03em;
        }
        .preview-badge--published {
          background: rgba(39,174,96,0.15);
          color: var(--success);
          border: 1px solid rgba(39,174,96,0.3);
        }
        .preview-badge--draft {
          background: rgba(231,76,60,0.15);
          color: var(--danger);
          border: 1px solid rgba(231,76,60,0.3);
        }
        .preview-badge--nav {
          background: rgba(41,128,185,0.15);
          color: var(--primary-light);
          border: 1px solid rgba(41,128,185,0.3);
        }

        /* ---- Content Area ---- */
        .preview-content {
          max-width: 900px;
          margin: 0 auto;
          padding: 2.5rem 2rem 4rem;
        }

        /* Headings */
        .preview-content h1 {
          font-size: 2rem;
          font-weight: 800;
          color: var(--text-primary);
          margin: 2rem 0 1rem;
          padding-bottom: 0.5rem;
          border-bottom: 2px solid var(--accent);
        }
        .preview-content h2 {
          font-size: 1.5rem;
          font-weight: 700;
          color: var(--accent-light);
          margin: 2rem 0 0.75rem;
          padding-bottom: 0.4rem;
          border-bottom: 1px solid var(--border-color);
        }
        .preview-content h3 {
          font-size: 1.2rem;
          font-weight: 600;
          color: var(--primary-light);
          margin: 1.5rem 0 0.5rem;
        }

        /* Paragraphs & Links */
        .preview-content p {
          color: var(--text-secondary);
          margin-bottom: 1rem;
          font-size: 1rem;
          line-height: 1.8;
        }
        .preview-content a {
          color: var(--accent-light);
          text-decoration: underline;
          text-underline-offset: 3px;
        }

        /* Strong & Em */
        .preview-content strong { color: var(--text-primary); font-weight: 600; }
        .preview-content em { font-style: italic; }

        /* Lists */
        .preview-content ul, .preview-content ol {
          padding-left: 1.5rem;
          margin-bottom: 1rem;
          color: var(--text-secondary);
        }
        .preview-content li {
          margin-bottom: 0.4rem;
          line-height: 1.7;
        }
        .preview-content ul li::marker { color: var(--accent); }
        .preview-content ol li::marker { color: var(--accent-light); font-weight: 600; }

        /* Table */
        .preview-table-wrap {
          overflow-x: auto;
          margin: 1.5rem 0;
          border-radius: 12px;
          border: 1px solid var(--border-color);
          background: var(--bg-card);
        }
        .preview-content table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.92rem;
        }
        .preview-content thead th {
          background: rgba(26,82,118,0.3);
          color: var(--primary-light);
          font-weight: 600;
          text-transform: uppercase;
          font-size: 0.78rem;
          letter-spacing: 0.05em;
          padding: 12px 16px;
          text-align: left;
          border-bottom: 2px solid var(--border-color);
        }
        .preview-content td {
          padding: 10px 16px;
          border-bottom: 1px solid var(--border-color);
          color: var(--text-secondary);
        }
        .preview-content tr:last-child td { border-bottom: none; }
        .preview-content tr:hover td { background: rgba(255,255,255,0.02); }

        /* Blockquote */
        .preview-content blockquote {
          border-left: 4px solid var(--accent);
          background: rgba(230,126,34,0.08);
          padding: 1rem 1.5rem;
          margin: 1.5rem 0;
          border-radius: 0 12px 12px 0;
          font-style: italic;
          color: var(--text-secondary);
        }
        .preview-content blockquote p {
          margin-bottom: 0;
          color: inherit;
        }

        /* Code */
        .preview-content code {
          background: rgba(255,255,255,0.08);
          padding: 2px 6px;
          border-radius: 4px;
          font-family: 'Fira Code', monospace;
          font-size: 0.88em;
          color: var(--accent-light);
        }
        .preview-content pre {
          background: var(--bg-card);
          border: 1px solid var(--border-color);
          border-radius: 10px;
          padding: 1rem;
          overflow-x: auto;
          margin: 1.5rem 0;
        }
        .preview-content pre code {
          background: none;
          padding: 0;
        }

        /* Images */
        .preview-content img {
          max-width: 100%;
          height: auto;
          border-radius: 12px;
          margin: 1.5rem 0;
          border: 1px solid var(--border-color);
        }

        /* HR */
        .preview-content hr {
          border: none;
          border-top: 1px solid var(--border-color);
          margin: 2rem 0;
        }

        /* Empty state */
        .preview-empty {
          text-align: center;
          padding: 4rem 2rem;
          color: var(--text-secondary);
          opacity: 0.5;
        }
        .preview-empty svg {
          margin-bottom: 1rem;
        }
      `;

      // Simple markdown-to-HTML converter for the preview
      function markdownToHtml(md) {
        if (!md) return '';
        var html = md;

        // Escape HTML entities (but preserve markdown)
        // Don't escape here as markdown itself has < > usage

        // Tables: detect GFM tables and convert
        html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)*)/gm, function(match, header, sep, body) {
          var ths = header.split('|').filter(function(c) { return c.trim(); })
            .map(function(c) { return '<th>' + c.trim() + '</th>'; }).join('');
          var rows = body.trim().split('\n').map(function(row) {
            var tds = row.split('|').filter(function(c) { return c.trim(); })
              .map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('');
            return '<tr>' + tds + '</tr>';
          }).join('');
          return '<div class="preview-table-wrap"><table><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        });

        // Headings
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

        // Blockquotes
        html = html.replace(/^>\s*(.+)$/gm, '<blockquote><p>$1</p></blockquote>');
        // Merge consecutive blockquotes
        html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

        // Bold + Italic
        html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

        // Links
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

        // Images
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />');

        // Unordered lists
        html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
        html = html.replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul>$1</ul>');

        // Ordered lists
        html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

        // Horizontal rules
        html = html.replace(/^---+$/gm, '<hr>');

        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Paragraphs: wrap lines that aren't already in block elements
        var lines = html.split('\n');
        var result = [];
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line === '') {
            result.push('');
          } else if (/^<(h[1-6]|ul|ol|li|table|div|blockquote|hr|pre|img)/.test(line) || /<\/(ul|ol|table|div|blockquote|pre)>$/.test(line)) {
            result.push(line);
          } else if (line.length > 0 && !/^</.test(line)) {
            result.push('<p>' + line + '</p>');
          } else {
            result.push(line);
          }
        }

        return result.join('\n');
      }

      // Register the preview template for Custom Pages
      var PagePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']) || 'Untitled Page';
          var heroImage = entry.getIn(['data', 'heroImage']) || '';
          var body = entry.getIn(['data', 'body']) || '';
          var published = entry.getIn(['data', 'published']);
          var slug = entry.getIn(['data', 'slug']) || '';
          var showInTopbar = entry.getIn(['data', 'showInTopbar']) || false;
          var showInNavbar = entry.getIn(['data', 'showInNavbar']) || false;
          var showInFooter = entry.getIn(['data', 'showInFooter']) || false;

          // Build hero style
          var heroStyle = {};
          var heroClass = 'preview-hero';
          if (heroImage) {
            var imgSrc = this.props.getAsset(heroImage).toString();
            heroStyle.backgroundImage = 'url(' + imgSrc + ')';
            heroClass += ' preview-hero--with-image';
          }

          // Convert markdown body
          var bodyHtml = markdownToHtml(body);

          // Navigation badges
          var navBadges = [];
          if (showInTopbar) navBadges.push('Top Bar');
          if (showInNavbar) navBadges.push('Navbar');
          if (showInFooter) navBadges.push('Footer');

          return h('div', {},
            // Inject CSS
            h('style', {}, previewCSS),

            // Hero section
            h('div', { className: heroClass, style: heroStyle },
              h('div', { className: 'preview-hero__content' },
                h('div', { className: 'preview-hero__back' }, '← Home'),
                h('h1', {}, title)
              )
            ),

            // Status bar
            h('div', { className: 'preview-status' },
              h('span', { className: 'preview-badge ' + (published !== false ? 'preview-badge--published' : 'preview-badge--draft') },
                published !== false ? '● Published' : '● Draft'
              ),
              slug ? h('span', { className: 'preview-badge preview-badge--nav' }, '/page/' + slug) : null,
              navBadges.length > 0 ? h('span', { className: 'preview-badge preview-badge--nav' }, '🔗 Linked: ' + navBadges.join(', ')) : null
            ),

            // Visual Builder Button
            slug ? h('div', { style: {
              padding: '12px 24px',
              background: 'linear-gradient(135deg, #1a5276, #2980b9)',
              borderBottom: '1px solid #1e293b',
              textAlign: 'center'
            }},
              h('a', {
                href: '/admin/page-builder.html?slug=' + slug,
                target: '_blank',
                style: {
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '8px',
                  padding: '10px 24px',
                  background: '#fff',
                  color: '#1a5276',
                  textDecoration: 'none',
                  borderRadius: '8px',
                  fontWeight: '700',
                  fontSize: '0.9rem',
                  boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
                  transition: 'transform 0.2s'
                }
              }, '🎨 Open Visual Drag & Drop Page Builder →'),
              h('p', { style: { color: 'rgba(255,255,255,0.7)', fontSize: '0.75rem', marginTop: '6px' } },
                'Build this page visually with drag-and-drop blocks, columns, images, tables & more'
              )
            ) : null,

            // Body content
            body
              ? h('div', { className: 'preview-content', dangerouslySetInnerHTML: { __html: bodyHtml } })
              : h('div', { className: 'preview-empty' },
                  h('p', {}, '✏️ Start writing page content above to see the live preview here.')
                )
          );
        }
      });

      CMS.registerPreviewTemplate('pages', PagePreview);

      // =========================================================================
      // Preview for Announcements
      // =========================================================================
      var AnnouncementPreview = createClass({
        render: function() {
          var data = this.props.entry.getIn(['data', 'announcements']);
          var items = data ? data.toJS() : [];

          return h('div', { style: { fontFamily: 'Inter, sans-serif', background: '#0a0f1a', minHeight: '100vh', padding: '2rem' } },
            h('style', {}, previewCSS),
            h('h2', { style: { color: '#f39c12', marginBottom: '1rem', fontSize: '1.3rem' } }, '📢 Announcement Ticker Preview'),
            h('div', { style: { background: '#111827', borderRadius: '12px', border: '1px solid #1e293b', padding: '1rem', overflow: 'hidden' } },
              h('div', { style: { display: 'flex', gap: '2rem', color: '#94a3b8', fontSize: '0.95rem' } },
                items.map(function(item, i) {
                  var text = typeof item === 'string' ? item : (item.message || '');
                  return h('span', { key: i, style: { whiteSpace: 'nowrap', padding: '4px 12px', borderRight: i < items.length - 1 ? '1px solid #1e293b' : 'none' } }, text);
                })
              )
            ),
            h('p', { style: { color: '#64748b', fontSize: '0.8rem', marginTop: '1rem' } }, items.length + ' announcement(s) — These scroll horizontally on the live site')
          );
        }
      });

      CMS.registerPreviewTemplate('announcements', AnnouncementPreview);
    </script>
  </body>
</html>
